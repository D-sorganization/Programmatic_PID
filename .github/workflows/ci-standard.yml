name: CI Standard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install dev dependencies
        run: pip install --force-reinstall --ignore-installed -r dev-requirements.txt

      - name: Check tool version consistency
        run: python scripts/check_ci_policy.py tool-versions

      - name: Lint
        run: ruff check src/ tests/

      - name: Check formatting
        run: black --check src/ tests/

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Type check
        run: mypy src/ tests/ --ignore-missing-imports --show-error-codes
        continue-on-error: true

      - name: Security scan
        run: bandit -r src/ tests/ -ll -ii

      - name: Verify no placeholders
        run: python scripts/check_ci_policy.py no-placeholders

  security-scan:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install dev dependencies
        run: pip install --force-reinstall --ignore-installed -r dev-requirements.txt

      - name: Audit python dependencies
        run: pip-audit -r requirements.txt --progress-spinner=off

  tests:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install --force-reinstall --ignore-installed -r dev-requirements.txt
          pip install -e .

      - name: Run tests
        run: python -m pytest -p no:xvfb tests/ -v --cov=programmatic_pid --cov-report=xml --cov-report=term-missing

      - uses: codecov/codecov-action@v5
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Required branch-protection context for `main` (org ruleset
  # Repository_Protections requires exactly this name). It aggregates lint AND
  # the test suite so a red test run blocks merge - before the 2026-09-15 fleet
  # audit only lint was gated here and failing tests merged freely.
  #
  # `if: always()` is load-bearing: without it an upstream failure *skips* this
  # job, and GitHub treats a skipped required check as passing.
  quality-gate:
    needs: [lint, tests]
    if: always()
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - name: Require every gated job to succeed
        shell: bash
        env:
          RESULT_LINT: ${{ needs.lint.result }}
          RESULT_TESTS: ${{ needs.tests.result }}
          SKIPPED_OK: "-"
        run: |
          failed=0
          for pair in "lint=$RESULT_LINT" "tests=$RESULT_TESTS"; do
            job="${pair%%=*}"
            result="${pair#*=}"
            echo "$job: $result"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && [[ " $SKIPPED_OK " == *" $job "* ]]; then
              echo "::notice::$job was skipped by its own condition; allowed."
              continue
            fi
            echo "::error::$job reported '$result', expected 'success'."
            failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::quality-gate: one or more gated jobs did not succeed."
            exit 1
          fi
          echo "quality-gate: all gated jobs succeeded."
