name: Nightly

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-tests:
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Create isolated Python environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install dependencies
        env:
          PIP_DEFAULT_TIMEOUT: "120"
          PIP_RETRIES: "5"
        run: |
          python -m pip install --retries "$PIP_RETRIES" -r requirements.txt
          python -m pip install --retries "$PIP_RETRIES" --force-reinstall --ignore-installed -r dev-requirements.txt
          python -m pip install --retries "$PIP_RETRIES" -e .

      - name: Run nightly tests
        run: python -m pytest -p no:xvfb tests/ -m "not live_simulation" --durations=20

  report-failure:
    timeout-minutes: 30
    needs: nightly-tests
    if: failure() && github.event_name == 'schedule'
    runs-on: ${{ vars.RUNNER_TARGET == 'local' && 'd-sorg-fleet' || 'ubuntu-latest' }}
    permissions:
      issues: write
    steps:
      - name: File CI failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const labels = ['ci-failure', 'nightly'];
            const normalizedSignature = [
              context.workflow,
              context.repo.repo,
              'nightly-tests',
            ].join('::').toLowerCase();
            const occurrence = [
              `- Run: ${runUrl}`,
              `  Run ID: \`${context.runId}\``,
              `  Commit: \`${context.sha}\``,
              `  Runner: \`${process.env.RUNNER_NAME || 'unknown'}\``,
              '  Failing step: `nightly-tests`',
              `  Signature: \`${normalizedSignature}\``,
            ].join('\n');
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: labels.join(','),
              per_page: 25,
            });
            const existing = existingIssues.find((issue) => !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nightly failure occurrence recorded for ${today}.\n\n${occurrence}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly CI failure - ${today}`,
              body: [
                'The scheduled nightly workflow failed.',
                '',
                '## Occurrences',
                occurrence,
              ].join('\n'),
              labels,
            });
